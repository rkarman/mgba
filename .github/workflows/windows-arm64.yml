name: Windows ARM64

on:
  pull_request:
  push:
    branches:
      - master
      - feature/woa-arm64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 90

    env:
      BUILD_DIR: ${{ github.workspace }}\build\windows-arm64
      DEPLOY_DIR: ${{ github.workspace }}\build\windows-arm64-deploy
      QT_ROOT: ${{ github.workspace }}\.cache\Qt
      QT_VERSION: 6.11.1
      QT_ARCH: win64_msvc2022_arm64
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg\archives
      VCPKG_TARGET_TRIPLET: arm64-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Report native toolchain
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object OSArchitecture, Version, BuildNumber
          [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          python -c "import platform; print(platform.machine())"
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          $architectures = (
            python -m aqt list-qt windows_arm64 desktop --arch $env:QT_VERSION
          ) -split '\s+' | Where-Object { $_ }
          $architectures
          if ($architectures -notcontains $env:QT_ARCH) {
            throw "Qt architecture $env:QT_ARCH is unavailable for Qt $env:QT_VERSION"
          }
          python -m aqt install-qt `
            windows_arm64 `
            desktop `
            $env:QT_VERSION `
            $env:QT_ARCH `
            --outputdir $env:QT_ROOT

      - name: Verify Qt installation
        shell: pwsh
        run: |
          $qt = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_arm64"
          $required = @(
            "$qt\bin\windeployqt.exe",
            "$qt\lib\cmake\Qt6\Qt6Config.cmake"
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            throw "Qt installation is incomplete: $($missing -join ', ')"
          }

      - name: Identify vcpkg revision
        id: vcpkg
        shell: pwsh
        run: |
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ steps.vcpkg.outputs.revision }}-sdl2-epoxy-libzip-zlib-bzip2

      - name: Install ARM64 dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "sdl2:$env:VCPKG_TARGET_TRIPLET" `
            "libepoxy:$env:VCPKG_TARGET_TRIPLET" `
            "libzip:$env:VCPKG_TARGET_TRIPLET" `
            "zlib:$env:VCPKG_TARGET_TRIPLET" `
            "bzip2:$env:VCPKG_TARGET_TRIPLET"

      - name: Configure
        shell: pwsh
        run: |
          $qt = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_arm64"
          cmake -S . -B $env:BUILD_DIR `
            -A ARM64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET" `
            "-DCMAKE_PREFIX_PATH=$qt" `
            -DBUILD_QT=ON `
            -DBUILD_SDL=ON `
            -DBUILD_HEADLESS=ON `
            -DBUILD_CINEMA=ON `
            -DBUILD_PERF=ON `
            -DBUILD_EXAMPLE=OFF `
            -DUSE_FFMPEG=OFF `
            -DUSE_LUA=OFF `
            -DUSE_PNG=ON `
            -DUSE_SQLITE3=ON `
            -DUSE_LIBZIP=ON `
            -DUSE_MINIZIP=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR `
            --config Release `
            --target mgba-qt mgba-sdl mgba-headless mgba-cinema mgba-perf `
            --parallel 4

      - name: Run cinema baselines
        shell: pwsh
        run: |
          $env:PATH = "$env:BUILD_DIR\Release;$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TARGET_TRIPLET\bin;$env:PATH"
          $out = Join-Path $env:BUILD_DIR "cinema-output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "$env:BUILD_DIR\test\Release\mgba-cinema.exe" `
            --base "${{ github.workspace }}\cinema" `
            --outdir $out `
            -v `
            gba.obj.2d-wrap `
            gb.acid.dmg-acid2
          if ($LASTEXITCODE -ne 0) {
            throw "Cinema baselines failed with exit code $LASTEXITCODE"
          }

      - name: Run performance smoke tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:PATH = "$env:BUILD_DIR\Release;$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TARGET_TRIPLET\bin;$env:PATH"
          $perf = "$env:BUILD_DIR\Release\mgba-perf.exe"

          $gba = & $perf `
            -F 60 `
            -N `
            -P `
            "${{ github.workspace }}\cinema\gba\obj\2d-wrap\test.gba"
          $gba | Write-Host
          if ($LASTEXITCODE -ne 0 -or -not ($gba -match ',60,\d+,none$')) {
            throw "No-video performance smoke test failed"
          }

          $gb = & $perf `
            -F 60 `
            -P `
            "${{ github.workspace }}\cinema\gb\acid\dmg-acid2\test.gb"
          $gb | Write-Host
          if ($LASTEXITCODE -ne 0 -or -not ($gb -match ',60,\d+,software$')) {
            throw "Software-rendered performance smoke test failed"
          }

      - name: Upload cinema diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mGBA-windows-arm64-cinema-diagnostics
          path: ${{ env.BUILD_DIR }}\cinema-output
          if-no-files-found: warn
          retention-days: 7

      - name: Stage Qt deployment
        shell: pwsh
        run: |
          $qt = Join-Path $env:QT_ROOT "$env:QT_VERSION\msvc2022_arm64"
          New-Item -ItemType Directory -Force -Path $env:DEPLOY_DIR | Out-Null
          Copy-Item "$env:BUILD_DIR\Release\*" -Destination $env:DEPLOY_DIR -Recurse
          Remove-Item "$env:DEPLOY_DIR\mgba-perf.exe"
          Get-ChildItem $env:DEPLOY_DIR -Recurse -File -Include *.lib,*.exp,*.pdb,*.ilk |
            Remove-Item -Force
          & "$qt\bin\windeployqt.exe" `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            --no-compiler-runtime `
            "$env:DEPLOY_DIR\mGBA.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Directory -Filter "Microsoft.VC*.CRT" |
            Where-Object {
              $_.FullName -match '\\MSVC\\\d+\.\d+\.\d+\\arm64\\Microsoft\.VC\d+\.CRT$'
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crt) {
            throw "Could not find the ARM64 Visual C++ runtime"
          }
          foreach ($runtime in @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll"
          )) {
            Copy-Item (Join-Path $crt.FullName $runtime) -Destination $env:DEPLOY_DIR
          }

          Copy-Item "res\nointro.dat" -Destination $env:DEPLOY_DIR
          Copy-Item "res\shaders" -Destination $env:DEPLOY_DIR -Recurse
          New-Item -ItemType Directory -Force -Path "$env:DEPLOY_DIR\licenses" | Out-Null
          Copy-Item "res\licenses\inih.txt" -Destination "$env:DEPLOY_DIR\licenses"
          Copy-Item "res\licenses\discord-rpc.txt" -Destination "$env:DEPLOY_DIR\licenses"
          Copy-Item "res\licenses\rapidjson.txt" -Destination "$env:DEPLOY_DIR\licenses"
          Copy-Item "README.md" -Destination $env:DEPLOY_DIR
          New-Item -ItemType File -Force -Path "$env:DEPLOY_DIR\portable.ini" | Out-Null

          $utf8 = [System.Text.UTF8Encoding]::new($false)
          foreach ($document in @("CHANGES", "LICENSE")) {
            $content = (Get-Content -LiteralPath $document -Raw) -replace "`r?`n", "`r`n"
            [System.IO.File]::WriteAllText(
              "$env:DEPLOY_DIR\$document.txt",
              $content,
              $utf8
            )
          }

      - name: Create portable archive
        id: package
        shell: pwsh
        run: |
          $versionLine = Select-String `
            -LiteralPath "$env:BUILD_DIR\CMakeCache.txt" `
            -Pattern '^VERSION_STRING_CACHE:STRING=(.+)$'
          if (-not $versionLine) {
            throw "VERSION_STRING_CACHE is missing from CMakeCache.txt"
          }
          $version = $versionLine.Matches[0].Groups[1].Value
          $cleanVersion = $version -replace '[^-A-Za-z0-9_.]', '-'
          if ("${{ github.event_name }}" -eq "pull_request") {
            $shortSha = "${{ github.event.pull_request.head.sha }}".Substring(0, 12)
            $cleanVersion = "$cleanVersion-pr${{ github.event.pull_request.number }}-$shortSha"
          }
          $packageName = "mGBA-$cleanVersion-windows-arm64"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName
          $archive = Join-Path $env:RUNNER_TEMP "$packageName.zip"
          $checksum = "$archive.sha256"

          Remove-Item -LiteralPath $packageDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "$env:DEPLOY_DIR\*" -Destination $packageDir -Recurse
          Compress-Archive -LiteralPath $packageDir -DestinationPath $archive

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $ascii = [System.Text.ASCIIEncoding]::new()
          [System.IO.File]::WriteAllText(
            $checksum,
            "$hash  $([System.IO.Path]::GetFileName($archive))`n",
            $ascii
          )

          "name=$packageName" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Audit portable archive
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "mGBA-windows-arm64-audit"
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath "${{ steps.package.outputs.archive }}" -DestinationPath $extract
          $packageRoot = Join-Path $extract "${{ steps.package.outputs.name }}"

          $required = @(
            "mGBA.exe",
            "mgba.dll",
            "SDL2.dll",
            "epoxy-0.dll",
            "zip.dll",
            "z.dll",
            "bz2.dll",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "platforms\qwindows.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "nointro.dat",
            "shaders",
            "licenses\inih.txt",
            "licenses\discord-rpc.txt",
            "licenses\rapidjson.txt",
            "CHANGES.txt",
            "LICENSE.txt",
            "README.md",
            "portable.ini"
          )
          $missing = $required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $packageRoot $_))
          }
          if ($missing) {
            throw "Portable archive is missing required files: $($missing -join ', ')"
          }

          $developmentFiles = Get-ChildItem $packageRoot -Recurse -File `
            -Include *.lib,*.exp,*.pdb,*.ilk
          if ($developmentFiles) {
            throw "Portable archive contains development files: $($developmentFiles.Name -join ', ')"
          }

          $testTools = Get-ChildItem $packageRoot -Recurse -File |
            Where-Object Name -In "mgba-cinema.exe", "mgba-perf.exe"
          if ($testTools) {
            throw "Portable archive contains test tools: $($testTools.Name -join ', ')"
          }

          foreach ($document in @("CHANGES.txt", "LICENSE.txt")) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path $packageRoot $document))
            if ([System.Array]::IndexOf($bytes, [byte]13) -lt 0) {
              throw "$document does not contain CRLF line endings"
            }
          }

          $binaries = Get-ChildItem -LiteralPath $packageRoot -Recurse -File |
            Where-Object Extension -In ".exe", ".dll"
          if ($binaries.Count -lt 20) {
            throw "Deployment contains only $($binaries.Count) PE files; expected at least 20"
          }

          $invalid = foreach ($binary in $binaries) {
            $stream = [System.IO.File]::OpenRead($binary.FullName)
            $reader = [System.IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                "$($binary.FullName): missing MZ header"
                continue
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                "$($binary.FullName): missing PE header"
                continue
              }
              $machine = $reader.ReadUInt16()
              if ($machine -ne 0xAA64) {
                "$($binary.FullName): machine 0x$($machine.ToString('X4'))"
              }
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }
          if ($invalid) {
            $invalid | ForEach-Object { Write-Host $_ }
            throw "Deployment architecture audit failed"
          }
          "Audited $($binaries.Count) native ARM64 PE files"

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -File -Filter "dumpbin.exe" |
            Where-Object { $_.FullName -match '\\bin\\Hostarm64\\arm64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "Could not find the native ARM64 dumpbin executable"
          }

          $unresolved = foreach ($binary in $binaries) {
            $dependencies = & $dumpbin.FullName "-dependents" $binary.FullName |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^[A-Za-z0-9_.-]+\.dll$' }
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $($binary.FullName)"
            }
            foreach ($dependency in $dependencies) {
              $packaged = Test-Path -LiteralPath (Join-Path $packageRoot $dependency)
              $system = Test-Path -LiteralPath (
                Join-Path $env:SystemRoot "System32\$dependency"
              )
              $apiSet = $dependency -match '^(api|ext)-ms-win-'
              $redistributable = $dependency -match `
                '^(concrt|mfc|msvcp|vcamp|vccorlib|vcomp|vcruntime)\d.*\.dll$'
              if (
                -not $apiSet -and
                -not $packaged -and
                ($redistributable -or -not $system)
              ) {
                "$($binary.FullName): $dependency"
              }
            }
          }
          if ($unresolved) {
            $unresolved | ForEach-Object { Write-Host $_ }
            throw "Portable archive contains unresolved runtime dependencies"
          }

          $expected = (
            Get-Content -LiteralPath "${{ steps.package.outputs.checksum }}"
          ).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          $actual = (
            Get-FileHash -LiteralPath "${{ steps.package.outputs.archive }}" -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Portable archive checksum mismatch"
          }

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
